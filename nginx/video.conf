proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=hls_cache:10m max_size=1g inactive=24h use_temp_path=off;

# Map to avoid caching playlists and cache segments
map $request_uri $cache_control {
    ~*\.m3u8$    "no-cache, max-age=30";
    ~*\.ts$      "public, max-age=3600";
    default      "no-cache";
}

# Limit requests per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Main HTTPS Server ───────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── SSL Certificates ─────────────────────────────────────────────

    # ssl_certificate     /etc/nginx/ssl/server.crt;
    # ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_certificate     /etc/nginx/ssl/aapico_2026.crt;
    ssl_certificate_key /etc/nginx/ssl/aapico_2026.key;

    # ── Modern SSL Configuration (Mozilla Intermediate) ──────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security Headers ─────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow large video uploads
    client_max_body_size 4G;

    # ── CORS origin setup ────────────────────────────────────────────
    set $cors_origin "*";
    if ($http_origin) {
        set $cors_origin $http_origin;
    }

    # ── Proxy to Portal (React Frontend) ────────────────────────────────
    location / {
        proxy_pass http://portal:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support SPA client-side routing
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # ── Proxy to Node App Routes ─────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE Support: Disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # Websocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # ── HLS files directly from MinIO ────────────────────────────────
    location /hls/ {
        rewrite ^/hls/(.*)$ /hls-videos/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        
        proxy_cache hls_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 1h;
        proxy_ignore_headers Cache-Control;
        add_header Cache-Control $cache_control;

        # Byte range support
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;

        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Range, Accept, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Range, Accept, Cache-Control" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            return 204;
        }
    }

    # ── Thumbnails files directly from MinIO ─────────────────────────
    location /thumbnails/ {
        rewrite ^/thumbnails/(.*)$ /thumbnails/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        
        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
    }
}
