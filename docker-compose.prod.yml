##
## Production override – use with:
##   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
##

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_RAW=raw-videos
      - MINIO_BUCKET_HLS=hls-videos
      - MINIO_BUCKET_THUMBS=thumbnails
      - JWT_SECRET=${JWT_SECRET}
      - MOODLE_DOMAIN=${MOODLE_DOMAIN}
      - PRESIGNED_URL_TTL=${PRESIGNED_URL_TTL:-14400}
    # Do NOT expose app port externally in production (nginx handles it)
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_RAW=raw-videos
      - MINIO_BUCKET_HLS=hls-videos
      - MINIO_BUCKET_THUMBS=thumbnails
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    # Do NOT expose postgres externally in production
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  redis:
    restart: always
    # Do NOT expose redis externally in production
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  minio:
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    # Do NOT expose minio externally in production (nginx handles /hls/, /thumbnails/)
    ports: []
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    restart: always
    ports:
      - "551:80"
      - "552:443"
    volumes:
      - ./nginx/video.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certbot-webroot:/var/www/certbot:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:
  miniodata:
  certbot-webroot:
