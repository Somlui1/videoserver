

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-server-app:latest
    container_name: video-server-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://user:pass@postgres:5432/videodb
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_RAW=raw-videos
      - MINIO_BUCKET_HLS=hls-videos
      - MINIO_BUCKET_THUMBS=thumbnails
      - JWT_SECRET=changeme
      - MOODLE_DOMAIN=https://moodle.yourcompany.com
      - PRESIGNED_URL_TTL=14400
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - video-network

  worker:
    image: video-server-app:latest
    container_name: video-server-worker
    command: ["npm", "run", "worker"]
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/videodb
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_RAW=raw-videos
      - MINIO_BUCKET_HLS=hls-videos
      - MINIO_BUCKET_THUMBS=thumbnails
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - video-network

  postgres:
    image: postgres:15-alpine
    container_name: video-server-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=videodb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mount schema.sql to run on first init
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d videodb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - video-network

  redis:
    image: redis:7-alpine
    container_name: video-server-redis
    ports:
      - "6379:6379"
    networks:
      - video-network

  minio:
    image: minio/minio:latest
    container_name: video-server-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - video-network

  portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aapico-video-portal:latest
    container_name: aapico-video-portal
    environment:
      - NODE_ENV=production
      - PORT=4000
      - VITE_APP_URL=http://app:3000
      - VITE_VIDEO_SERVER_URL=http://app:3000
      - JWT_SECRET=changeme
    depends_on:
      - app
    networks:
      - video-network

  nginx:
    image: nginx:alpine
    container_name: video-server-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/video.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - portal
      - minio
    networks:
      - video-network

volumes:
  pgdata:
  miniodata:

networks:
  video-network:
    driver: bridge
